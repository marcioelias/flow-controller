name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Formatação, lints e testes — o equivalente Rust de pint + phpstan
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: placeholder da SPA (rust-embed exige frontend/dist)
        run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (warnings = erro)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: type-check
        run: npx vue-tsc --noEmit
      - name: build
        run: npm run build

  # CVEs conhecidas nas dependências (RustSec advisory DB)
  audit:
    runs-on: ubuntu-latest
    # audit-check publica o resultado como check run
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # RUSTSEC-2023-0071 (rsa, sem correção): só no lockfile via driver MySQL
          # opcional do sqlx; não compila (`cargo tree -i rsa` vazio)
          ignore: RUSTSEC-2023-0071

  # Política de dependências: licenças permitidas, fontes, duplicatas
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

name: Build and Publish Docker Images

on:
  push:
    branches: [ "main" ]
    tags:     [ 'v*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY:   ghcr.io
  COLLECTOR:  ghcr.io/${{ github.repository_owner }}/flowvision-collector
  DASHBOARD:  ghcr.io/${{ github.repository_owner }}/flowvision-dashboard

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git rev-list --count in build.rs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive version label ────────────────────────────────────────────
      # On a tag push (v1.2.3 or v1.2.3-beta.1) → use the tag.
      # On a branch push → use branch name + short SHA.
      - name: Compute image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"          # e.g. v1.2.3-beta.1
            VER="${TAG#v}"                           # e.g. 1.2.3-beta.1
            echo "collector_tags=${{ env.COLLECTOR }}:${VER},${{ env.COLLECTOR }}:latest" >> $GITHUB_OUTPUT
            echo "dashboard_tags=${{ env.DASHBOARD }}:${VER},${{ env.DASHBOARD }}:latest" >> $GITHUB_OUTPUT
          else
            SHA="${GITHUB_SHA::7}"
            BRANCH="${GITHUB_REF#refs/heads/}"
            echo "collector_tags=${{ env.COLLECTOR }}:${BRANCH}-${SHA}" >> $GITHUB_OUTPUT
            echo "dashboard_tags=${{ env.DASHBOARD }}:${BRANCH}-${SHA}" >> $GITHUB_OUTPUT
          fi

      # ── Collector ───────────────────────────────────────────────────────
      - name: Build and push Collector
        uses: docker/build-push-action@v6
        with:
          context:    .
          file: Dockerfile
          push:       ${{ github.event_name != 'pull_request' }}
          tags:       ${{ steps.tags.outputs.collector_tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Dashboard ───────────────────────────────────────────────────────
      # Context is repo root so the Dockerfile can COPY VERSION from there
      - name: Build and push Dashboard
        uses: docker/build-push-action@v6
        with:
          context:    .
          file: frontend/Dockerfile
          push:       ${{ github.event_name != 'pull_request' }}
          tags:       ${{ steps.tags.outputs.dashboard_tags }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

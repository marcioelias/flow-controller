[package]
name = "clickhouse-exporter"
version = "0.1.0"
edition = "2021"

[dependencies]
clickhouse = { version = "0.11", default-features = false, features = ["lz4"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.37", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"

flow-types = { path = "../flow-types" }
aggregator = { path = "../aggregator" }

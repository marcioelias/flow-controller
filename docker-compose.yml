services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: ch-database
    ports:
      # Debug Externo (Você pode acessar e rodar Query bruta por fora no Dbeaver)
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - flow-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  flow-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rust-collector
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      # Porta massiva real da vida para roteadores injetarem Flows (Firewall pass needed!)
      - "2055:2055/udp"
    networks:
      - flow-net
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue-dashboard
    depends_on:
      - clickhouse
    ports:
      # Sua dashboard fica ativa publicamente pelo IP local da infra (Mudei para 8080 para evitar conflito local)
      - "8080:80"
    networks:
      - flow-net
    restart: unless-stopped

networks:
  flow-net:
    driver: bridge

volumes:
  clickhouse_data:
